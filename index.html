<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a2b" />
    <title>Elite Gulf Recruitment | Gulf Recruitment &amp; Manpower Agency</title>
    <meta
      name="description"
      content="Elite Gulf Recruitment connects Gulf employers with qualified workers from Morocco and international markets. View current vacancies in Saudi Arabia, UAE, Qatar, Kuwait, Bahrain and Oman, and apply in one click on WhatsApp."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static forms so Netlify's build-time bot can detect them.
      These are never shown or used directly - the real forms are the React
      ones, which submit to these same form names via fetch(). Keep the
      field names below in sync with the React forms.
    -->
    <form name="job-application" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="job-title" />
      <input type="text" name="job-country" />
      <input type="text" name="job-city" />
      <input type="text" name="full-name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="nationality" />
      <input type="text" name="age" />
      <input type="text" name="experience" />
      <input type="text" name="location" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="employer-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="company-name" />
      <input type="text" name="contact-person" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <input type="text" name="position" />
      <input type="text" name="workers" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="full-name" />
      <input type="text" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
